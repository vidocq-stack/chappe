// Proto minimal pour la conformité grpcurl côté chappe.
// EchoMessage est utilisé en request ET response : champ "message" tag 1.
// Le serveur fait un echo des bytes bruts (sans décoder protobuf),
// donc grpcurl re-décode le payload reçu comme EchoMessage et affiche
// le même contenu — valide le wire HTTP/2 + framing 5 octets + trailers
// d'un point de vue client externe.
syntax = "proto3";

package echo;

service EchoService {
  rpc Echo(EchoMessage) returns (EchoMessage);
}

message EchoMessage {
  string message = 1;
}
