worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections  16384;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 100000;

    server {
        listen ${PORT} default_server reuseport;
        server_name _;

        location / {
            default_type text/plain;
            return 200 "ok";
        }
    }
}
