#
# Config native-image embarquée — détectée automatiquement par native-image
# quand chappe-bench est dans le classpath (META-INF/native-image/{groupId}/{artifactId}/).
#
# Cible : binaire ChappeMain pour le shootout (handler "/ → ok").
#
# Pourquoi --initialize-at-build-time :
#   Le projet Chappe est "compile-time first" — zéro réflexion, static blocks
#   purs (BuildInfo, StatusCodeCache, HpackHuffman, Http2ErrorCode, HpackStaticTable).
#   Initialiser à build-time réduit le démarrage et la taille du binaire.
#
# Pourquoi -march=compatibility :
#   L'image distroless résultante doit tourner sur n'importe quelle VM x86_64,
#   pas seulement celle du build (sinon SIGILL sur instruction inconnue).
#
Args = --enable-preview \
       --no-fallback \
       -march=compatibility \
       -H:+UnlockExperimentalVMOptions \
       -H:+StaticExecutableWithDynamicLibC \
       --initialize-at-build-time=io.vidocq.chappe.api \
       --initialize-at-build-time=io.vidocq.chappe.core \
       --initialize-at-build-time=io.vidocq.chappe.http \
       --initialize-at-build-time=io.vidocq.chappe.bench.oop.ChappeMain \
       --initialize-at-build-time=io.vidocq.chappe.bench.oop.OopArgs
