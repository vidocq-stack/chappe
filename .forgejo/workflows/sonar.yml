# SonarQube analysis, pilot of the rollout (Vidocq/vidocq#284): main on every
# push, pull requests on every update, on https://sonar.vidocq.dev (SonarQube
# Community Build with the community branch plugin).
#
# Blocking mode (Vidocq/vidocq#284, October 2026): the job fails when the analysis
# fails or the quality gate is not passed (new issues, new-code coverage under 80 %,
# new duplication), and `sonar / sonar` is a required check of main. The pull
# request still gets one comment, kept up to date, with the quality gate. Pull
# requests from forks receive no secrets and skip the analysis.
#
# A manual run (workflow_dispatch) analyses main again, for instance after an
# analysis the server could not take; it is refused on any other branch, whose
# code would otherwise replace main's analysis.
#
# Prerequisites: org secret SONAR_TOKEN, org variable SONAR_HOST_URL,
#                org secret VIDOCQ_BOT_TOKEN (the pull-request comment).
name: sonar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # whole history: new-code detection and blame
      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
      - uses: https://codefloe.com/Vidocq/ci/sonar-analysis@main
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          host-url: ${{ vars.SONAR_HOST_URL }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          # A finding, a coverage or a duplication the quality gate refuses fails the job (required check).
          blocking: 'true'
          # Pilot of Error Prone in the analysis (Vidocq/vidocq#269): the action's default, plus the
          # errorprone profile, whose warnings the action imports as external issues.
          maven-args: -B -ntp -Pquality,errorprone -Dmaven.test.failure.ignore=true install
          # Infer's RacerD over the main sources (Vidocq/vidocq#269): data races in Chappe's concurrent code, found
          # in seconds. Needs the trixie job image (glibc 2.38 or later).
          infer: 'true'
