name: Notify Slack

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

jobs:
  notify-pr-open:
    # PR opened / reopened / marked ready for review
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (PR opened)
        uses: https://codeberg.org/Vidocq/ci/notify-slack@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: pr-open
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-url: ${{ github.event.pull_request.html_url }}

  notify-pr-merged:
    # PR closed WITH merge (PRs merely closed without merge are ignored)
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (PR merged)
        uses: https://codeberg.org/Vidocq/ci/notify-slack@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: pr-merged
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-url: ${{ github.event.pull_request.html_url }}
          merged-by: ${{ github.event.pull_request.merged_by.login }}
          base-ref: ${{ github.event.pull_request.base.ref }}
