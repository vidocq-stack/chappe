name: Notify docs

# Fire vidocq-docs rebuild whenever a push on main touches the Antora sources.
# Dedicated workflow (rather than a job in ci.yml) so the path filter is honored
# without skipping the rest of CI when only code changes.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  notify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: https://codeberg.org/Vidocq/ci/trigger-docs-rebuild@main
        with:
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          source-repo: ${{ github.repository }}
