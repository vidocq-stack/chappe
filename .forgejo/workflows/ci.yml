name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build & test
        run: mvn --no-transfer-progress verify

      - name: Deploy to Forgejo Maven registry
        run: mvn -B -ntp deploy -DskipTests

      - name: Notify Signal on failure
        if: failure()
        env:
          SIGNAL_API_URL: ${{ secrets.SIGNAL_API_URL }}
          SIGNAL_AUTH: ${{ secrets.SIGNAL_AUTH }}
          SIGNAL_FROM: ${{ secrets.SIGNAL_FROM }}
          SIGNAL_TO: ${{ secrets.SIGNAL_TO }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SIGNAL_API_URL:-}" ] && missing+=("SIGNAL_API_URL")
          [ -z "${SIGNAL_AUTH:-}" ]    && missing+=("SIGNAL_AUTH")
          [ -z "${SIGNAL_FROM:-}" ]    && missing+=("SIGNAL_FROM")
          [ -z "${SIGNAL_TO:-}" ]      && missing+=("SIGNAL_TO")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Secret(s) Forgejo manquant(s) : ${missing[*]}" >&2
            exit 1
          fi
          payload=$(node <<'JS'
          process.stdout.write(JSON.stringify({
            number: process.env.SIGNAL_FROM,
            recipients: [process.env.SIGNAL_TO],
            message: `[ViBot]: ❌ Build CI échoué — ${process.env.REPO}@${process.env.REF}\n${process.env.RUN_URL}`
          }))
          JS
          )
          curl -fsS -u "$SIGNAL_AUTH" -X POST "$SIGNAL_API_URL/v2/send" \
            -H 'Content-Type: application/json' \
            -d "$payload"
