name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build & test
        run: mvn --no-transfer-progress verify

      - name: Deploy to Forgejo Maven registry
        run: mvn -B -ntp deploy -DskipTests
