# Pull-request validation: the producer, then its downstream consumers in PARALLEL ("flat"
# check, Vidocq/vidocq#285, CI study step 2). There is NO staging registry: nothing is
# published. Each job builds what it needs at a release-style PR version (<base>-PR<n>.<sha8>),
# straight into its own local ~/.m2.
#
#   governance-checks  CLA, GPG signature, Signed-off-by. Required context
#                      `pr-validate / governance-checks (pull_request)`.
#   producer           build, unit tests and declared TCK of this repository at the PR version,
#                      plus its own checks.
#   impacted           the transitive consumers, from the Vidocq dependency graph, as a matrix
#                      (ci/resolve-impacted), in parallel with the producer.
#   downstream         one job per consumer (ci/build-one-consumer): the producer rebuilt at the
#                      PR version without tests, then the consumer against it, with its tests.
#                      Only the producer's version is pinned; every other io.vidocq upstream
#                      comes from central-snapshots as published, which is what Central holds
#                      right after the merge. An intermediate upstream with a companion branch
#                      for this PR is rebuilt first, in the same job.
#   pr-validate        the aggregator. Required context `pr-validate / pr-validate
#                      (pull_request)`, unchanged. It always runs and fails unless governance,
#                      producer, impacted and downstream all succeeded. A skipped downstream
#                      passes ONLY for a docs-only or test-only change set, or when no consumer
#                      is impacted: on Forgejo a skipped job satisfies branch protection, so a
#                      skip must never pass when work was expected.
#
# Pull requests no longer check the eventual state, where every intermediate consumer is rebuilt
# in order against the new producer. The producers with at least 5 transitive consumers check it
# every night on main with the sequential chain (downstream-nightly.yml, non-blocking, Slack on
# red).
#
# Kept in sync with GestionProjet/workflow-templates/pr-producer.yml — edit there
# and re-propagate to every producer repo.
#
# Prerequisite: org secret VIDOCQ_BOT_TOKEN (read graph, clone consumers, query API).
#               org secret SLACK_WEBHOOK_URL (success notification).
name: pr-validate
on:
  pull_request:
    branches: [main]

jobs:
  # CLA + GPG-signature + Signed-off-by gate, mutualised in a composite action
  # (https://codefloe.com/Vidocq/ci/governance-checks). Forgejo does not resolve
  # cross-repo reusable workflows, so the shared logic ships as a step-level action.
  # fetch-depth: 0 is required so the action can read the BASE_REF..HEAD commit range.
  governance-checks:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://codefloe.com/Vidocq/ci/governance-checks@main
        with:
          pr-author: ${{ github.event.pull_request.user.login }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Build, unit tests and declared TCK of this repository at the PR version, plus its own
  # checks. Like every job, gated on the governance checks: a PR that fails the
  # CLA/GPG/sign-off gate builds nothing and is never reported as validated.
  producer:
    needs: governance-checks
    runs-on: vidocq-runner
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      test-only: ${{ steps.changes.outputs.test-only }}
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect a docs-only change set
        # Docs-only PRs (*.md, *.adoc, docs/, LICENSE*, NOTICE*) skip the whole
        # Maven build AND the downstream rebuild — the job still completes and
        # reports the required `pr-validate` check as green. Files under any
        # src/ directory never count as docs (they may be packaged in the
        # artifact). Implemented as step-level `if`s: a `paths:` trigger filter
        # would leave the required check unreported and block /merge forever.
        id: changes
        run: |
          set -euo pipefail
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.number }}/files"
          # VIDOCQ_BOT_TOKEN lifts rate limits on internal PRs; external fork
          # PRs get no secrets and fall back to anonymous reads (public repo).
          auth=()
          if [ -n "${{ secrets.VIDOCQ_BOT_TOKEN }}" ]; then
            auth=(-H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}")
          fi
          files=""
          page=1
          while :; do
            chunk=$(curl -fsS "${auth[@]}" "${api}?page=${page}&limit=50" \
              | python3 -c 'import sys,json; print("\n".join(f["filename"] for f in json.load(sys.stdin)))')
            [ -z "$chunk" ] && break
            files="${files}${chunk}"$'\n'
            page=$((page+1))
          done
          echo "Changed files:"; printf '%s' "$files" | sed 's/^/  /'
          docs_only=true
          [ -n "$(printf '%s' "$files" | tr -d '[:space:]')" ] || docs_only=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*|*/src/*) docs_only=false; break ;;
              *.md|*.adoc|docs/*|LICENSE|LICENSE.*|NOTICE|NOTICE.*) ;;
              *) docs_only=false; break ;;
            esac
          done <<EOF
          $files
          EOF
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only"

          # Test-only change set: every file is under a src/test/ directory (any module) or is a doc
          # file accepted above. Only the downstream rebuild (ci/build-impacted) is skipped for it:
          # test code is not part of the produced artifacts, so consumers cannot observe the change.
          # The producer's own build, unit tests and TCK still run. Forced to false when a pom.xml
          # declares `<goal>test-jar</goal>`: a published test jar makes test changes visible downstream.
          test_only=true
          [ -n "$(printf '%s' "$files" | tr -d '[:space:]')" ] || test_only=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/test/*|*/src/test/*) ;;
              src/*|*/src/*) test_only=false; break ;;
              *.md|*.adoc|docs/*|LICENSE|LICENSE.*|NOTICE|NOTICE.*) ;;
              *) test_only=false; break ;;
            esac
          done <<< "$files"
          if [ "$test_only" = true ] && grep -rqs --include=pom.xml -e '<goal>test-jar</goal>' .; then
            test_only=false
          fi
          echo "test-only=$test_only" >> "$GITHUB_OUTPUT"
          echo "test-only: $test_only"

      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
        if: steps.changes.outputs.docs-only != 'true'

      - name: Compute PR version (release-style, no -SNAPSHOT)
        if: steps.changes.outputs.docs-only != 'true'
        id: version
        run: |
          # Parse pom.xml directly with Python — `mvn help:evaluate -q` does not strip all
          # [INFO] lines on Maven 4, which yields corrupted versions. Namespace detected
          # dynamically (Model 4.0.0 vs 4.1.0).
          BASE=$(python3 - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = root.tag[1:].split("}", 1)[0] if root.tag.startswith("{") else ""
          v = root.find(f"{{{ns}}}version") if ns else root.find("version")
          if v is None or not v.text:
              sys.stderr.write(f"root <version> not found (ns={ns!r})\n"); sys.exit(1)
          print(re.sub(r"-SNAPSHOT$", "", v.text.strip()))
          PY
          )
          if [ -z "$BASE" ]; then
            echo "Could not read project.version from pom.xml" >&2; exit 1
          fi
          SHA8="${{ github.event.pull_request.head.sha }}"; SHA8="${SHA8:0:8}"
          SUFFIX="PR${{ github.event.number }}.${SHA8}"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "PR version: ${BASE}-${SUFFIX}"

      - name: Set PR version across the reactor
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Sync plugin.xml descriptors with the PR version
        if: steps.changes.outputs.docs-only != 'true'
        # versions:set does not touch resources; maven-plugin modules embed a plugin.xml
        # with a hardcoded <version> — without this sync the plugin JAR ships a stale
        # descriptor and every consumer fails with "Plugin's descriptor contains the wrong
        # version".
        run: |
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          rp = ET.parse("pom.xml").getroot()
          ns = rp.tag[1:].split("}", 1)[0] if rp.tag.startswith("{") else ""
          v = rp.find(f"{{{ns}}}version") if ns else rp.find("version")
          version = v.text.strip()
          n = 0
          for pom in Path(".").rglob("pom.xml"):
              if "target" in pom.parts:
                  continue
              try:
                  r = ET.parse(pom).getroot()
              except ET.ParseError:
                  continue
              pns = r.tag[1:].split("}", 1)[0] if r.tag.startswith("{") else ""
              pkg = r.find(f"{{{pns}}}packaging") if pns else r.find("packaging")
              if pkg is None or (pkg.text or "").strip() != "maven-plugin":
                  continue
              px = pom.parent / "src/main/resources/META-INF/maven/plugin.xml"
              if not px.is_file():
                  continue
              content = px.read_text(encoding="utf-8")
              new = re.sub(r"(<artifactId>[^<]+</artifactId>\s*\n\s*<version>)[^<]+(</version>)",
                           rf"\g<1>{version}\g<2>", content, count=1)
              if new != content:
                  px.write_text(new, encoding="utf-8"); n += 1
          print(f"plugin.xml synced: {n}")
          PY

      - name: Build, test & install the producer locally
        if: steps.changes.outputs.docs-only != 'true'
        # install (not deploy): the PR artifact lands in ~/.m2 only — nothing is published.
        # install runs the full lifecycle incl. integration-test/verify.
        run: mvn -B -ntp install

  # Graph resolution only (no checkout, no Maven), in parallel with the producer build.
  impacted:
    needs: governance-checks
    runs-on: vidocq-runner
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      upstreams: ${{ steps.resolve.outputs.upstreams }}
    steps:
      - id: resolve
        uses: https://codefloe.com/Vidocq/ci/resolve-impacted@main
        with:
          producer-slug: ${{ github.repository }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

  # One job per consumer, once the producer's own build and tests are green. Skipped for a
  # docs-only or test-only change set (test code is not part of the produced artifacts) and when
  # no consumer is impacted; the aggregator checks that a skip was expected.
  downstream:
    needs: [producer, impacted]
    if: needs.producer.outputs.docs-only != 'true' && needs.producer.outputs.test-only != 'true' && needs.impacted.outputs.count != '0'
    runs-on: vidocq-runner
    strategy:
      fail-fast: false          # report every broken consumer at once
      max-parallel: 6           # 6 of the org's ~20 slots
      matrix: ${{ fromJSON(needs.impacted.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
      - uses: https://codefloe.com/Vidocq/ci/build-one-consumer@main
        with:
          consumer: ${{ matrix.repo }}
          upstreams: ${{ fromJSON(needs.impacted.outputs.upstreams)[matrix.repo] }}
          producer-slug: ${{ github.repository }}
          producer-version: ${{ needs.producer.outputs.version }}
          version-suffix: ${{ needs.producer.outputs.suffix }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

  # The aggregator, required context `pr-validate / pr-validate (pull_request)`. It always runs:
  # a skipped job counts as a success for Forgejo branch protection, so this job decides, and a
  # skip passes only when no work was expected.
  pr-validate:
    needs: [governance-checks, producer, impacted, downstream]
    if: always()
    runs-on: vidocq-runner
    steps:
      - name: Verdict
        env:
          GOVERNANCE: ${{ needs.governance-checks.result }}
          PRODUCER: ${{ needs.producer.result }}
          IMPACTED: ${{ needs.impacted.result }}
          DOWNSTREAM: ${{ needs.downstream.result }}
          DOCS_ONLY: ${{ needs.producer.outputs.docs-only }}
          TEST_ONLY: ${{ needs.producer.outputs.test-only }}
          COUNT: ${{ needs.impacted.outputs.count }}
        run: |
          set -eu
          fail() { echo "::error title=pr-validate::$1"; exit 1; }
          echo "governance=$GOVERNANCE producer=$PRODUCER impacted=$IMPACTED downstream=$DOWNSTREAM docs-only=${DOCS_ONLY:-?} test-only=${TEST_ONLY:-?} consumers=${COUNT:-?}"
          [ "$GOVERNANCE" = success ] || fail "governance checks: ${GOVERNANCE}"
          [ "$PRODUCER" = success ] || fail "producer build, tests or checks: ${PRODUCER}"
          [ "$IMPACTED" = success ] || fail "the impacted consumers were not resolved: ${IMPACTED}"
          case "$DOWNSTREAM" in
            success)
              echo "Every impacted consumer (${COUNT}) built against the pull request." ;;
            skipped)
              if [ "$DOCS_ONLY" = true ] || [ "$TEST_ONLY" = true ]; then
                echo "Docs-only or test-only change set: no downstream build expected."
              elif [ "$COUNT" = 0 ]; then
                echo "No impacted consumer on the forge: nothing to build."
              else
                fail "downstream skipped although ${COUNT:-an unknown number of} consumer(s) were expected"
              fi ;;
            *) fail "downstream: ${DOWNSTREAM}. At least one consumer failed or was cancelled; see the downstream jobs." ;;
          esac

      - name: Notify Slack on PR success
        if: success()
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: pr-validated
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-url: ${{ github.event.pull_request.html_url }}
