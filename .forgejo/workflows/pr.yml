# Pull-request validation: the producer, then its downstream consumers in PARALLEL ("flat"
# check, Vidocq/vidocq#285, CI study step 2). There is NO staging registry: nothing is
# published. Each job builds what it needs at a release-style PR version (<base>-PR<n>.<sha8>),
# straight into its own local ~/.m2.
#
#   pr-state           what the pull request is NOW, read through the API (ci/pr-validate-gate, mode
#                      state), and so which jobs run:
#                        - a train member (label `train-member`, a line `Train-top: #N` in the
#                          description) builds nothing: it is validated through its train's top and
#                          landed by ci/scripts/train-merge.py;
#                        - a WIP or blocked pull request (the maintainer's rule: `wip` anywhere in the
#                          title, a `Draft:`/`[draft]` prefix, a draft, a label containing `wip` or
#                          `blocked`) builds and tests the producer, not its consumers;
#                        - an edit or a label change that leaves the pull request as it was reproduces
#                          the verdict of the latest completed run on the same commit, builds nothing.
#   governance-checks  CLA, GPG signature, Signed-off-by. Required context
#                      `pr-validate / governance-checks (pull_request)`.
#   producer           build, unit tests and declared TCK of this repository at the PR version,
#                      plus its own checks.
#   impacted           the transitive consumers, from the Vidocq dependency graph, as a matrix
#                      (ci/resolve-impacted), in parallel with the producer.
#   downstream         one job per consumer (ci/build-one-consumer): the producer rebuilt at the
#                      PR version without tests, then the consumer against it, with its tests.
#                      Only the producer's version is pinned; every other io.vidocq upstream
#                      comes from central-snapshots as published, which is what Central holds
#                      right after the merge. An intermediate upstream with a companion branch
#                      for this PR is rebuilt first, in the same job.
#   pr-validate        the aggregator. Required context `pr-validate / pr-validate
#                      (pull_request)`, unchanged. It always runs, and ci/pr-validate-gate (mode
#                      verdict) decides from toJSON(needs): it fails unless governance, producer,
#                      impacted and downstream all succeeded. A skipped downstream passes ONLY for a
#                      docs-only or test-only change set, or when no consumer is impacted: on Forgejo
#                      a skipped job satisfies branch protection, so a skip must never pass when work
#                      was expected. It FAILS a train member and a WIP or blocked pull request ("WIP:
#                      downstream not run; remove WIP to validate", "Blocked: ..."), and reproduces a
#                      verdict when the state job said so. Every rule lives in the composite, resolved from @main: a change of
#                      policy needs no change here.
#
# Pull requests no longer check the eventual state, where every intermediate consumer is rebuilt
# in order against the new producer. The producers with at least 5 transitive consumers check it
# every night on main with the sequential chain (downstream-nightly.yml, non-blocking, Slack on
# red).
#
# Kept in sync with GestionProjet/workflow-templates/pr-producer.yml — edit there
# and re-propagate to every producer repo.
#
# Prerequisite: org secret VIDOCQ_BOT_TOKEN (read graph, clone consumers, query API).
#               org secret SLACK_WEBHOOK_URL (success notification).
name: pr-validate
on:
  pull_request:
    branches: [main]
    # opened, synchronize, reopened: the defaults. edited: a title change (adding or removing `wip`, `Draft:`)
    # validates again. labeled, unlabeled: adding or removing a wip, blocked or `train-member` label does too (Forgejo 16
    # sends one of them per label added or removed). A run whose change is irrelevant (a description edit)
    # reproduces the last verdict instead of building again: see the pr-state job.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  # What the pull request is now (ready, WIP, train member), and which jobs run. No checkout: API reads only,
  # anonymous on a fork pull request (public repositories).
  pr-state:
    runs-on: vidocq-runner
    outputs:
      state: ${{ steps.state.outputs.state }}
      run-producer: ${{ steps.state.outputs.run-producer }}
      run-downstream: ${{ steps.state.outputs.run-downstream }}
    steps:
      - id: state
        uses: https://codefloe.com/Vidocq/ci/pr-validate-gate@main
        with:
          mode: state
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

  # CLA + GPG-signature + Signed-off-by gate, mutualised in a composite action
  # (https://codefloe.com/Vidocq/ci/governance-checks). Forgejo does not resolve
  # cross-repo reusable workflows, so the shared logic ships as a step-level action.
  # fetch-depth: 0 is required so the action can read the BASE_REF..HEAD commit range.
  governance-checks:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://codefloe.com/Vidocq/ci/governance-checks@main
        with:
          pr-author: ${{ github.event.pull_request.user.login }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Build, unit tests and declared TCK of this repository at the PR version, plus its own
  # checks. Like every job, gated on the governance checks: a PR that fails the
  # CLA/GPG/sign-off gate builds nothing and is never reported as validated. Not run for a
  # train member, nor when the state job reproduces an earlier verdict.
  producer:
    needs: [governance-checks, pr-state]
    if: needs.pr-state.outputs.run-producer == 'true'
    runs-on: vidocq-runner
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      test-only: ${{ steps.changes.outputs.test-only }}
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      reused: ${{ steps.reuse.outputs.reused }}
      tree-id: ${{ steps.reuse.outputs.tree-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect a docs-only change set
        # Docs-only PRs (*.md, *.adoc, docs/, LICENSE*, NOTICE*) skip the whole
        # Maven build AND the downstream rebuild — the job still completes and
        # reports the required `pr-validate` check as green. Files under any
        # src/ directory never count as docs (they may be packaged in the
        # artifact). Implemented as step-level `if`s: a `paths:` trigger filter
        # would leave the required check unreported and block /merge forever.
        id: changes
        run: |
          set -euo pipefail
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.number }}/files"
          # VIDOCQ_BOT_TOKEN lifts rate limits on internal PRs; external fork
          # PRs get no secrets and fall back to anonymous reads (public repo).
          auth=()
          if [ -n "${{ secrets.VIDOCQ_BOT_TOKEN }}" ]; then
            auth=(-H "Authorization: token ${{ secrets.VIDOCQ_BOT_TOKEN }}")
          fi
          files=""
          page=1
          while :; do
            chunk=$(curl -fsS "${auth[@]}" "${api}?page=${page}&limit=50" \
              | python3 -c 'import sys,json; print("\n".join(f["filename"] for f in json.load(sys.stdin)))')
            [ -z "$chunk" ] && break
            files="${files}${chunk}"$'\n'
            page=$((page+1))
          done
          echo "Changed files:"; printf '%s' "$files" | sed 's/^/  /'
          docs_only=true
          [ -n "$(printf '%s' "$files" | tr -d '[:space:]')" ] || docs_only=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*|*/src/*) docs_only=false; break ;;
              *.md|*.adoc|docs/*|LICENSE|LICENSE.*|NOTICE|NOTICE.*) ;;
              *) docs_only=false; break ;;
            esac
          done <<EOF
          $files
          EOF
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only"

          # Test-only change set: every file is under a src/test/ directory (any module), is CI
          # configuration (.forgejo/), or is a doc file accepted above. None of them is part of the
          # produced artifacts, so consumers cannot observe the change: only the downstream rebuild is
          # skipped. The producer's own build, unit tests and TCK still run (they also exercise a changed
          # workflow). When test files changed, forced to false if a pom.xml declares
          # `<goal>test-jar</goal>`: a published test jar makes test changes visible downstream.
          test_only=true
          has_test=false
          [ -n "$(printf '%s' "$files" | tr -d '[:space:]')" ] || test_only=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/test/*|*/src/test/*) has_test=true ;;
              .forgejo/*) ;;
              src/*|*/src/*) test_only=false; break ;;
              *.md|*.adoc|docs/*|LICENSE|LICENSE.*|NOTICE|NOTICE.*) ;;
              *) test_only=false; break ;;
            esac
          done <<< "$files"
          if [ "$test_only" = true ] && [ "$has_test" = true ] \
              && grep -rqs --include=pom.xml -e '<goal>test-jar</goal>' .; then
            test_only=false
          fi
          echo "test-only=$test_only" >> "$GITHUB_OUTPUT"
          echo "test-only: $test_only"

      - name: Reuse the validation of an unchanged code tree
        # Vidocq/ci#57: when a run of this repository already validated the same code (HEAD's tree without the
        # documentation files), as after a docs-only commit, a rebase on a main that moved by documentation only or
        # the merge-bot's re-signing of an unchanged rebase, the build, the TCK and the downstream check are not run
        # again. A re-run, and a companion branch, always build.
        id: reuse
        if: steps.changes.outputs.docs-only != 'true'
        uses: https://codefloe.com/Vidocq/ci/validated-tree@main
        with:
          mode: check
          scope: pr-validate
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
        if: steps.changes.outputs.docs-only != 'true' && steps.reuse.outputs.reused != 'true'

      - name: Compute PR version (release-style, no -SNAPSHOT)
        if: steps.changes.outputs.docs-only != 'true' && steps.reuse.outputs.reused != 'true'
        id: version
        run: |
          # Parse pom.xml directly with Python — `mvn help:evaluate -q` does not strip all
          # [INFO] lines on Maven 4, which yields corrupted versions. Namespace detected
          # dynamically (Model 4.0.0 vs 4.1.0).
          BASE=$(python3 - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = root.tag[1:].split("}", 1)[0] if root.tag.startswith("{") else ""
          v = root.find(f"{{{ns}}}version") if ns else root.find("version")
          if v is None or not v.text:
              sys.stderr.write(f"root <version> not found (ns={ns!r})\n"); sys.exit(1)
          print(re.sub(r"-SNAPSHOT$", "", v.text.strip()))
          PY
          )
          if [ -z "$BASE" ]; then
            echo "Could not read project.version from pom.xml" >&2; exit 1
          fi
          SHA8="${{ github.event.pull_request.head.sha }}"; SHA8="${SHA8:0:8}"
          SUFFIX="PR${{ github.event.number }}.${SHA8}"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "PR version: ${BASE}-${SUFFIX}"

      - name: Set PR version across the reactor
        if: steps.changes.outputs.docs-only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Sync plugin.xml descriptors with the PR version
        if: steps.changes.outputs.docs-only != 'true' && steps.reuse.outputs.reused != 'true'
        # versions:set does not touch resources; maven-plugin modules embed a plugin.xml
        # with a hardcoded <version> — without this sync the plugin JAR ships a stale
        # descriptor and every consumer fails with "Plugin's descriptor contains the wrong
        # version".
        run: |
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          rp = ET.parse("pom.xml").getroot()
          ns = rp.tag[1:].split("}", 1)[0] if rp.tag.startswith("{") else ""
          v = rp.find(f"{{{ns}}}version") if ns else rp.find("version")
          version = v.text.strip()
          n = 0
          for pom in Path(".").rglob("pom.xml"):
              if "target" in pom.parts:
                  continue
              try:
                  r = ET.parse(pom).getroot()
              except ET.ParseError:
                  continue
              pns = r.tag[1:].split("}", 1)[0] if r.tag.startswith("{") else ""
              pkg = r.find(f"{{{pns}}}packaging") if pns else r.find("packaging")
              if pkg is None or (pkg.text or "").strip() != "maven-plugin":
                  continue
              px = pom.parent / "src/main/resources/META-INF/maven/plugin.xml"
              if not px.is_file():
                  continue
              content = px.read_text(encoding="utf-8")
              new = re.sub(r"(<artifactId>[^<]+</artifactId>\s*\n\s*<version>)[^<]+(</version>)",
                           rf"\g<1>{version}\g<2>", content, count=1)
              if new != content:
                  px.write_text(new, encoding="utf-8"); n += 1
          print(f"plugin.xml synced: {n}")
          PY

      - name: Build, test & install the producer locally
        if: steps.changes.outputs.docs-only != 'true' && steps.reuse.outputs.reused != 'true'
        # install (not deploy): the PR artifact lands in ~/.m2 only — nothing is published.
        # install runs the full lifecycle incl. integration-test/verify.
        run: mvn -B -ntp install

      # Build the producer once (Vidocq/ci producer-artifacts, Vidocq/vidocq#285): the artifacts just
      # installed at the PR version (no sources, javadoc or test jars) go to the run as
      # producer-artifacts-<run id>, which the downstream jobs install, sha256-checked, instead of
      # rebuilding the producer each (any problem: they rebuild). Published whenever the build runs and
      # the downstream check may run, without waiting for the impacted matrix; the verdict job deletes
      # it, and its one-day retention is the backstop.
      - name: Share the producer artifacts with the downstream jobs
        if: steps.changes.outputs.docs-only != 'true' && steps.changes.outputs.test-only != 'true' && steps.reuse.outputs.reused != 'true' && needs.pr-state.outputs.run-downstream == 'true'
        uses: https://codefloe.com/Vidocq/ci/producer-artifacts@main
        with:
          producer-version: ${{ steps.version.outputs.version }}

  # Graph resolution only (no checkout, no Maven), in parallel with the producer build. Only when the
  # downstream check runs (not for a WIP pull request or a train member).
  impacted:
    needs: [governance-checks, pr-state]
    if: needs.pr-state.outputs.run-downstream == 'true'
    runs-on: vidocq-runner
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      upstreams: ${{ steps.resolve.outputs.upstreams }}
    steps:
      - id: resolve
        uses: https://codefloe.com/Vidocq/ci/resolve-impacted@main
        with:
          producer-slug: ${{ github.repository }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

  # One job per consumer, once the producer's own build and tests are green. Skipped for a
  # docs-only or test-only change set (test code is not part of the produced artifacts), when
  # no consumer is impacted, for a WIP pull request and a train member; the aggregator checks
  # that a skip was expected.
  downstream:
    needs: [pr-state, producer, impacted]
    if: needs.pr-state.outputs.run-downstream == 'true' && needs.producer.outputs.docs-only != 'true' && needs.producer.outputs.test-only != 'true' && needs.producer.outputs.reused != 'true' && needs.impacted.outputs.count != '0'
    runs-on: vidocq-runner
    strategy:
      fail-fast: false          # report every broken consumer at once
      max-parallel: 6           # 6 of the org's ~20 slots
      matrix: ${{ fromJSON(needs.impacted.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
      - uses: https://codefloe.com/Vidocq/ci/build-one-consumer@main
        with:
          # The producer artifacts the producer job shared; a missing or unsound one rebuilds it.
          producer-artifacts: producer-artifacts-${{ github.run_id }}
          consumer: ${{ matrix.repo }}
          upstreams: ${{ fromJSON(needs.impacted.outputs.upstreams)[matrix.repo] }}
          producer-slug: ${{ github.repository }}
          producer-version: ${{ needs.producer.outputs.version }}
          version-suffix: ${{ needs.producer.outputs.suffix }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          # Run only the consumer tests whose build can see a chappe artifact. Every module still
          # compiles and packages, and any doubt falls back to the full test run (Vidocq/ci#54).
          tests: targeted

  # The aggregator, required context `pr-validate / pr-validate (pull_request)`. It always runs:
  # a skipped job counts as a success for Forgejo branch protection, so this job decides, and a
  # skip passes only when no work was expected. The whole verdict lives in ci/pr-validate-gate,
  # which needs every job above under these exact ids.
  pr-validate:
    needs: [governance-checks, pr-state, producer, impacted, downstream]
    if: always()
    runs-on: vidocq-runner
    steps:
      # The shared producer artifacts are only needed during the run. Never fails; independent of the
      # verdict below, which reads `needs` only.
      - name: Delete the shared producer artifacts
        if: always()
        uses: https://codefloe.com/Vidocq/ci/producer-artifacts@main
        with:
          mode: delete

      - name: Verdict
        id: gate
        uses: https://codefloe.com/Vidocq/ci/pr-validate-gate@main
        with:
          mode: verdict
          needs: ${{ toJSON(needs) }}
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - name: Record the validated code tree
        # A later push of the same code reuses this run (Vidocq/ci#57): a ref refs/validated/pr-validate/<id>, pushed with the
        # bot token. Not for a docs-only change set, which built nothing, and only when the producer ran here: a run
        # that reproduces an earlier verdict (ci/pr-validate-gate) has no tree id and nothing new to record.
        if: success() && needs.producer.result == 'success' && needs.producer.outputs.docs-only != 'true' && needs.producer.outputs.reused != 'true'
        uses: https://codefloe.com/Vidocq/ci/validated-tree@main
        with:
          mode: record
          scope: pr-validate
          tree-id: ${{ needs.producer.outputs.tree-id }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      # Not for a reproduced verdict (a description edit): the pull request was announced already.
      - name: Notify Slack on PR success
        if: success() && steps.gate.outputs.notify == 'true'
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: pr-validated
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-url: ${{ github.event.pull_request.html_url }}
