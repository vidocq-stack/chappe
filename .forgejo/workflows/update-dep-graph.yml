name: update-dependency-graph

# Extracts this repository's io.vidocq.* artifacts and dependencies and pushes them into
# Vidocq/dep-graph (data/<owner>_<repo>.json, with graph/inverted.json rebuilt in the same
# commit), the graph the pull-request downstream check reads (ci/resolve-impacted).
#
# Prerequisite: org secret VIDOCQ_BOT_TOKEN, with write access to Vidocq/dep-graph.
# Run it once by hand (workflow_dispatch) after adding it, to register the repository.
on:
  push:
    branches: [main, master]
    paths:
      - '**/pom.xml'
  workflow_dispatch:

jobs:
  update:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4
      - name: Update dependency graph
        uses: https://codefloe.com/Vidocq/ci/update-dep-graph@main
        with:
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          repo: ${{ github.repository }}
