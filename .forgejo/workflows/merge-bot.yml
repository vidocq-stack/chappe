name: merge-bot

# Declares when the bot may run; what it does lives in the reusable workflow
# held by Vidocq/ci. Every repository carries this same file, so a change to
# the bot's behaviour is one commit there rather than one pull request here.
#
# `runs-on` is deliberately absent: Forgejo's reference recommends omitting it
# on a calling job, which lets the forge expand the called workflow's jobs into
# the run instead of nesting them.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Pull request number to rebase, re-sign and (optionally) fast-forward merge'
        required: true
      merge:
        description: "Fast-forward merge after rebasing? Set to 'false' for rebase-only."
        default: 'true'

jobs:
  merge:
    uses: https://codefloe.com/Vidocq/ci/.forgejo/workflows/merge-bot-reusable.yml@main
    with:
      pr-number: ${{ github.event.inputs.pr-number }}
      merge: ${{ github.event.inputs.merge || 'true' }}
    secrets: inherit
